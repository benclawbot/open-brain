name: Verify

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openbrain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openbrain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate generated environment and container configuration
        env:
          OPENBRAIN_CONFIG_DIR: ${{ runner.temp }}/openbrain-config
        run: |
          python -m src.cli configure --project-root .
          docker compose config --quiet
      - name: Compile shipped modules
        run: python -m compileall -q src scripts tests
      - name: Lint correctness rules
        run: ruff check src scripts tests --select E9,F401,F541,F63,F7,F82,E722,F841,S110,ASYNC221,PLW1508,PLW1510,RUF012,B017,DTZ001,DTZ005,DTZ007
      - name: Apply migrations
        run: python scripts/migrate.py
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
      - name: Build package
        run: python -m build
      - name: Smoke-test wheel and Hermes provider
        run: |
          python -m venv /tmp/openbrain-smoke
          /tmp/openbrain-smoke/bin/pip install dist/*.whl
          /tmp/openbrain-smoke/bin/openbrain --version
          /tmp/openbrain-smoke/bin/openbrain install-hermes --hermes-home /tmp/hermes-smoke
          test -f /tmp/hermes-smoke/plugins/openbrain/plugin.yaml
          test -f /tmp/hermes-smoke/plugins/openbrain/__init__.py

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          print(project['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build package
        if: steps.existing.outputs.exists == 'false'
        run: python -m build
      - name: Smoke-test release wheel
        if: steps.existing.outputs.exists == 'false'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python -m venv /tmp/openbrain-release-smoke
          /tmp/openbrain-release-smoke/bin/pip install dist/*.whl
          ACTUAL_VERSION="$(/tmp/openbrain-release-smoke/bin/openbrain --version | awk '{print $3}')"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Open Brain $VERSION" \
            --generate-notes
